# Tests only. No deployment or Firebase login. Requires the existing draft Rules
# file to be committed alongside this isolated setup before a future manual run.
# workflow_dispatch must be present on the default branch to appear in the UI.
# Publishing there may separately trigger Pages: review that before any push.
name: Spark Firestore Rules (emulator only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-rules:
    # Standard hosted Ubuntu is free for this public repository. Refuse private
    # repository execution rather than consuming a potentially billable allowance.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests/firestore-spark
        shell: bash
    env:
      CI: 'true'
      RESETTABLE_SPARK_EMULATOR_TEST: '1'
      GCLOUD_PROJECT: demo-resettable-spark
      GOOGLE_CLOUD_PROJECT: demo-resettable-spark
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      FIREBASE_EMULATOR_HUB: 127.0.0.1:4400
      FIREBASE_TOKEN: ''
      FIREBASE_CONFIG: ''
      GOOGLE_APPLICATION_CREDENTIALS: ''
      NO_UPDATE_NOTIFIER: '1'
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx1024m
      # Fresh CLI config/cache on the runner; do not inherit an authenticated CLI
      # profile. No caches/artifacts are uploaded by this workflow.
      XDG_CONFIG_HOME: /tmp/resettable-spark-config
      FIREBASE_EMULATORS_PATH: /tmp/resettable-spark-emulators
    steps:
      - name: Check out reviewed test revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.13.0'
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fail closed before installing test dependencies
        run: node rules.cjs --check-config
      - name: Install locked dependencies on this disposable runner only
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run real Firestore Emulator Rules tests
        run: npm run test:emulator
